<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capturly Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: #0d1117; color: #c9d1d9; }
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 18px; color: #58a6ff; }
  .header .refresh { font-size: 12px; color: #8b949e; }
  .stats-bar { display: flex; gap: 24px; padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat .value { font-size: 24px; font-weight: 700; color: #58a6ff; }
  .stat .label { font-size: 11px; color: #8b949e; text-transform: uppercase; }
  .controls { padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
  .controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .controls button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .controls button:hover { border-color: #58a6ff; }
  .filter-row { padding: 8px 24px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .filter-row select, .filter-row input[type="text"] { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  .filter-row select:focus, .filter-row input[type="text"]:focus { border-color: #58a6ff; }
  .filter-row input[type="text"] { width: 220px; }
  .filter-chip { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; user-select: none; }
  .filter-chip:hover { border-color: #8b949e; color: #c9d1d9; }
  .filter-chip.active-ai { background: #1f6feb33; color: #58a6ff; border-color: #1f6feb; }
  .filter-chip.active-agui { background: #bc8cff33; color: #bc8cff; border-color: #bc8cff; }
  .filter-chip.active-sse { background: #3fb95033; color: #3fb950; border-color: #3fb950; }
  .filter-chip.active-tools { background: #d2992233; color: #d29922; border-color: #d29922; }
  .filter-clear { background: none; border: none; color: #f85149; cursor: pointer; font-size: 12px; padding: 4px 8px; display: none; }
  .filter-clear:hover { text-decoration: underline; }
  .traffic-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .traffic-table th { text-align: left; padding: 8px 12px; background: #161b22; color: #8b949e; font-weight: 600; border-bottom: 1px solid #30363d; position: sticky; top: 0; }
  .traffic-table td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
  .traffic-table tr:hover td { background: #161b22; }
  .traffic-table tr.selected td { background: #1f6feb1a; }
  .traffic-table tr.selected td:first-child { box-shadow: inset 3px 0 0 #1f6feb; }
  .traffic-table tr.clickable { cursor: pointer; }
  .method { font-weight: 700; }
  .method.POST { color: #3fb950; }
  .method.GET { color: #58a6ff; }
  .method.PUT { color: #d29922; }
  .method.DELETE { color: #f85149; }
  .status { font-weight: 600; }
  .status.s2xx { color: #3fb950; }
  .status.s4xx { color: #d29922; }
  .status.s5xx { color: #f85149; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.ai { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb; }
  .badge.sse { background: #3fb95033; color: #3fb950; border: 1px solid #3fb950; }
  .badge.agui { background: #bc8cff33; color: #bc8cff; border: 1px solid #bc8cff; }
  .badge.tools { background: #d2992233; color: #d29922; border: 1px solid #d29922; }
  .badge.source { background: #39c5cf33; color: #39c5cf; border: 1px solid #39c5cf; }
  .empty { text-align: center; padding: 48px; color: #8b949e; }
  .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
  .overlay.open { display: block; }
  .detail-panel { display: none; position: fixed; top: 0; right: 0; width: 55%; height: 100%; background: #161b22; border-left: 1px solid #30363d; overflow-y: auto; padding: 24px; z-index: 100; }
  .detail-panel.open { display: block; }
  .detail-panel h2 { font-size: 16px; margin-bottom: 16px; color: #58a6ff; word-break: break-all; }
  .detail-panel .close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; }
  .detail-panel .close:hover { color: #c9d1d9; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h3 { font-size: 13px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; }
  .detail-section pre, .detail-body pre { background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  details { margin-bottom: 8px; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
  details summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: #c9d1d9; background: #21262d; user-select: none; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .copy-btn { background: none; border: 1px solid #30363d; color: #8b949e; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .copy-btn:hover { color: #e6edf3; border-color: #8b949e; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '\25B6'; font-size: 10px; color: #8b949e; transition: transform 0.15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details summary:hover { background: #292e36; }
  details[open] summary { border-bottom: 1px solid #30363d; }
  .detail-body { padding: 12px 14px; }
  .detail-body h4 { font-size: 12px; color: #8b949e; text-transform: uppercase; margin: 12px 0 6px 0; }
  .detail-body h4:first-child { margin-top: 0; }
  .ai-meta { display: flex; gap: 20px; flex-wrap: wrap; padding: 12px 0; margin-bottom: 12px; border-bottom: 1px solid #30363d; }
  .ai-meta .meta-item { font-size: 12px; }
  .ai-meta .meta-key { color: #8b949e; margin-right: 4px; }
  .ai-meta .meta-val { color: #c9d1d9; font-weight: 600; }
  .msg { margin-bottom: 10px; border-left: 3px solid #30363d; padding: 8px 12px; background: #0d1117; border-radius: 0 6px 6px 0; }
  .msg.system { border-left-color: #d29922; }
  .msg.user { border-left-color: #58a6ff; }
  .msg.assistant { border-left-color: #3fb950; }
  .msg.tool { border-left-color: #bc8cff; }
  .msg .msg-role { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
  .msg.system .msg-role { color: #d29922; }
  .msg.user .msg-role { color: #58a6ff; }
  .msg.assistant .msg-role { color: #3fb950; }
  .msg.tool .msg-role { color: #bc8cff; }
  .msg .msg-content { font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #c9d1d9; }
  .tool-card { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; }
  .tool-card .tool-name { color: #bc8cff; font-weight: 600; font-size: 13px; font-family: monospace; }
  .tool-card .tool-desc { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .tool-card pre { margin-top: 6px; font-size: 11px; }
  .json-tree { background: #0d1117; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; line-height: 1.6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .json-tree .json-copy-src { display: none; }
  .j-row { cursor: pointer; border-radius: 3px; }
  .j-row:hover { background: #161b22; }
  .j-toggle { display: inline-block; width: 14px; color: #8b949e; font-size: 9px; user-select: none; }
  .j-toggle::before { content: '\25BC'; }
  .j-node.collapsed > .j-row > .j-toggle::before { content: '\25B6'; }
  .j-node.collapsed > .j-children, .j-node.collapsed > .j-closeline { display: none; }
  .j-preview { color: #8b949e; font-style: italic; }
  .j-node:not(.collapsed) > .j-row > .j-preview { display: none; }
  .j-key { color: #79c0ff; }
  .j-str { color: #a5d6ff; }
  .j-num { color: #d2a8ff; }
  .j-bool { color: #ff7b72; }
  .j-null { color: #8b949e; font-style: italic; }
  .j-brace { color: #e6edf3; }
  .j-children { padding-left: 18px; }
  .tool-card .json-tree { margin-top: 6px; font-size: 11px; padding: 8px; }
  .loading { text-align: center; padding: 48px; color: #8b949e; font-size: 14px; }
  details .loading { padding: 8px 0; display: block; text-align: left; }
  .show-more { background: #21262d; border: 1px solid #30363d; color: #58a6ff; cursor: pointer; font-size: 11px; padding: 2px 10px; border-radius: 4px; margin: 6px 0; display: inline-block; }
  .show-more:hover { border-color: #58a6ff; }
  .j-more { cursor: pointer; color: #8b949e; font-style: italic; }
  .j-more:hover { color: #58a6ff; }
</style>
</head>
<body>
<div class="header">
  <h1>&#x1F4E1; Capturly Traffic Dashboard</h1>
  <span class="refresh" id="last-refresh"></span>
</div>
<div class="stats-bar" id="stats-bar"></div>
<div class="controls">
  <button onclick="refresh()">&#x21BB; Refresh</button>
  <button onclick="truncate()" style="margin-left:auto;border-color:#f8514966;color:#f85149">&#x1F5D1; Clear Log</button>
</div>
<div class="filter-row">
  <select id="filter-method" onchange="onFilterChange()">
    <option value="">All Methods</option>
    <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option>
  </select>
  <select id="filter-source" onchange="onFilterChange()">
    <option value="">All Sources</option>
  </select>
  <input type="text" id="filter-path" placeholder="Filter by path..." oninput="onFilterChange()">
  <select id="filter-status" onchange="onFilterChange()">
    <option value="">All Status</option>
    <option value="2xx">2xx</option><option value="4xx">4xx</option><option value="5xx">5xx</option>
  </select>
  <span class="filter-chip" data-tag="ai" onclick="toggleTag(this)">AI</span>
  <span class="filter-chip" data-tag="agui" onclick="toggleTag(this)">AGUI</span>
  <span class="filter-chip" data-tag="sse" onclick="toggleTag(this)">SSE</span>
  <span class="filter-chip" data-tag="tools" onclick="toggleTag(this)">Tools</span>
  <button class="filter-clear" id="filter-clear" onclick="clearFilters()">&#x2715; Clear</button>
</div>
<table class="traffic-table">
  <thead><tr><th>#</th><th>Time</th><th>Source</th><th>Method</th><th>Path</th><th>Status</th><th>Duration</th><th>Req Size</th><th>Res Size</th><th>Tags</th></tr></thead>
  <tbody id="traffic-table"></tbody>
</table>
<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="close" onclick="closeDetail()">&times;</button>
  <div id="detail-content"></div>
</div>
<script>
var allEntries = [];
var entries = [];
var selectedIdx = null;
var filters = { method: null, path: '', status: null, source: null, tags: [] };
var currentDetail = null;      // full entry while the panel is open
var sectionRenderers = {};     // section id -> fn(entry) returning body html
var refreshTimer = null;

var TEXT_LIMIT = 2000;
var JSON_CHILD_LIMIT = 100;
var COPY_SRC_LIMIT = 100000;
var detailTexts = [];   // full strings behind truncated renderings
var detailValues = [];  // full values behind capped JSON trees

function storeText(t) { detailTexts.push(t); return detailTexts.length - 1; }
function storeValue(v) { detailValues.push(v); return detailValues.length - 1; }

function renderLongText(text) {
  if (text == null) return '';
  var s = String(text);
  if (s.length <= TEXT_LIMIT) return esc(s);
  var idx = storeText(s);
  return '<span class="trunc-wrap"><span class="trunc-text" data-text-idx="' + idx
    + '" data-shown="' + TEXT_LIMIT + '">' + esc(s.substring(0, TEXT_LIMIT)) + '</span>'
    + '<button class="show-more" onclick="revealMore(this)">Show more (+'
    + (s.length - TEXT_LIMIT) + ' chars)</button></span>';
}

function revealMore(btn) {
  var wrap = btn.parentElement;
  var span = wrap ? wrap.querySelector('.trunc-text') : null;
  if (!span) return;
  var idx = parseInt(span.getAttribute('data-text-idx'), 10);
  var shown = parseInt(span.getAttribute('data-shown'), 10) * 2;
  var full = detailTexts[idx] || '';
  if (shown >= full.length) {
    shown = full.length;
    btn.remove();
  } else {
    btn.textContent = 'Show more (+' + (full.length - shown) + ' chars)';
  }
  span.setAttribute('data-shown', String(shown));
  span.innerHTML = esc(full.substring(0, shown));
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escJson(obj) {
  if (obj == null) return '<span style="color:#8b949e">null</span>';
  if (typeof obj === 'string') return esc(obj);
  try { return esc(JSON.stringify(obj, null, 2)); } catch(e) { return esc(String(obj)); }
}

function fmtTime(ms) {
  if (!ms) return '-';
  return new Date(ms).toLocaleTimeString();
}

function fmtSize(b) {
  if (b == null) return '-';
  if (b < 1024) return b + ' B';
  return (b / 1024).toFixed(1) + ' KB';
}

function fmtDuration(ms) {
  if (ms == null) return '-';
  if (ms < 1) return '<1ms';
  if (ms < 1000) return Math.round(ms) + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function sourceLabel(e) {
  return e.source_name || e.backend_url || 'default';
}

function statusClass(code) {
  if (code >= 200 && code < 300) return 's2xx';
  if (code >= 400 && code < 500) return 's4xx';
  return 's5xx';
}

function copySection(btn) {
  const body = btn.closest('details').querySelector('.detail-body');
  // Clone offscreen and substitute each JSON tree with its full raw JSON,
  // so copying is complete regardless of which tree nodes are collapsed.
  var holder = document.createElement('div');
  holder.style.position = 'absolute';
  holder.style.left = '-9999px';
  holder.appendChild(body.cloneNode(true));
  var trees = holder.querySelectorAll('.json-tree');
  for (var i = 0; i < trees.length; i++) {
    var src = trees[i].querySelector('.json-copy-src');
    var pre = document.createElement('pre');
    pre.textContent = src ? src.textContent : '';
    trees[i].parentNode.replaceChild(pre, trees[i]);
  }
  document.body.appendChild(holder);
  const text = holder.innerText || holder.textContent;
  document.body.removeChild(holder);
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '⎘'; }, 1500);
  });
}
function collapsible(title, sectionId, open) {
  return '<details data-section="' + sectionId + '" data-rendered="false"' + (open ? ' open' : '')
    + '><summary><span>' + title + '</span><button class="copy-btn" onclick="event.preventDefault();copySection(this)" title="Copy">&#x2398;</button></summary>'
    + '<div class="detail-body"><span class="loading">Render on expand…</span></div></details>';
}

function metaItem(key, val) {
  return '<span class="meta-item"><span class="meta-key">' + esc(key) + ':</span> <span class="meta-val">' + esc(String(val)) + '</span></span>';
}

var JSON_EXPAND_DEPTH = 2;

function toggleJsonNode(rowEl) {
  var node = rowEl.closest('.j-node');
  if (node) node.classList.toggle('collapsed');
}

function jsonPrimitiveHtml(val) {
  if (val === null) return '<span class="j-null">null</span>';
  var t = typeof val;
  if (t === 'string') {
    if (val.length > TEXT_LIMIT) return '<span class="j-str">"' + renderLongText(val) + '"</span>';
    return '<span class="j-str">"' + esc(val) + '"</span>';
  }
  if (t === 'number') return '<span class="j-num">' + String(val) + '</span>';
  if (t === 'boolean') return '<span class="j-bool">' + String(val) + '</span>';
  return esc(String(val));
}

// Renders a JSON value as a collapsible tree node. keyHtml is the already
// rendered '"key": ' prefix (empty for array items and the root).
function jsonValueHtml(val, depth, keyHtml) {
  if (val === null || typeof val !== 'object') {
    return '<div class="j-line">' + keyHtml + jsonPrimitiveHtml(val) + '</div>';
  }
  var isArr = Array.isArray(val);
  var open = isArr ? '[' : '{';
  var close = isArr ? ']' : '}';
  var keys = isArr ? null : Object.keys(val);
  var count = isArr ? val.length : keys.length;
  if (count === 0) {
    return '<div class="j-line">' + keyHtml + '<span class="j-brace">' + open + close + '</span></div>';
  }
  var label = count + (isArr ? (count === 1 ? ' item' : ' items') : (count === 1 ? ' key' : ' keys'));
  var html = '<div class="j-node' + (depth < JSON_EXPAND_DEPTH ? '' : ' collapsed') + '">';
  html += '<div class="j-row" onclick="toggleJsonNode(this)"><span class="j-toggle"></span>' + keyHtml
    + '<span class="j-brace">' + open + '</span><span class="j-preview"> &#x2026; ' + label + ' ' + close + '</span></div>';
  html += '<div class="j-children">';
  var limit = Math.min(count, JSON_CHILD_LIMIT);
  html += jsonChildrenHtml(val, isArr, keys, 0, limit, depth);
  if (count > limit) {
    var vidx = storeValue(val);
    html += '<div class="j-line j-more" data-val-idx="' + vidx + '" data-offset="' + limit
      + '" data-depth="' + depth + '" onclick="loadMoreJson(this)">'
      + '<span class="j-preview">&#x2026; ' + (count - limit) + ' more (load)</span></div>';
  }
  html += '</div>';
  html += '<div class="j-line j-closeline"><span class="j-brace">' + close + '</span></div>';
  html += '</div>';
  return html;
}

function jsonChildrenHtml(val, isArr, keys, from, to, depth) {
  var html = '';
  for (var i = from; i < to; i++) {
    var k = isArr ? i : keys[i];
    var v = isArr ? val[i] : val[keys[i]];
    var childKey = isArr ? '' : '<span class="j-key">"' + esc(String(k)) + '"</span>: ';
    html += jsonValueHtml(v, depth + 1, childKey);
  }
  return html;
}

function loadMoreJson(rowEl) {
  var idx = parseInt(rowEl.getAttribute('data-val-idx'), 10);
  var offset = parseInt(rowEl.getAttribute('data-offset'), 10);
  var depth = parseInt(rowEl.getAttribute('data-depth'), 10);
  var val = detailValues[idx];
  if (val == null) return;
  var isArr = Array.isArray(val);
  var keys = isArr ? null : Object.keys(val);
  var count = isArr ? val.length : keys.length;
  var to = Math.min(offset + JSON_CHILD_LIMIT, count);
  rowEl.insertAdjacentHTML('beforebegin', jsonChildrenHtml(val, isArr, keys, offset, to, depth));
  if (to >= count) {
    rowEl.remove();
  } else {
    rowEl.setAttribute('data-offset', String(to));
    rowEl.querySelector('.j-preview').innerHTML = '&#x2026; ' + (count - to) + ' more (load)';
  }
}

function renderJsonTree(obj) {
  if (obj == null || typeof obj !== 'object') {
    return '<pre>' + escJson(obj) + '</pre>';
  }
  var copySrc;
  try { copySrc = JSON.stringify(obj, null, 2); } catch (e) { copySrc = String(obj); }
  // Only small trees carry the hidden full-JSON copy source; for huge bodies
  // copy falls back to whatever is currently rendered.
  var copyHtml = copySrc.length <= COPY_SRC_LIMIT
    ? '<pre class="json-copy-src">' + esc(copySrc) + '</pre>' : '';
  return '<div class="json-tree">' + copyHtml + jsonValueHtml(obj, 0, '') + '</div>';
}

function renderHeaders(headers) {
  if (!headers || !Object.keys(headers).length) return '<span style="color:#8b949e">No headers</span>';
  return renderJsonTree(headers);
}

function msgPlainText(content) {
  if (content == null) return '';
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(function(part) {
      if (part.type === 'text') return part.text || '';
      if (part.type === 'image_url') return '[Image: ' + String((part.image_url && part.image_url.url) || '').substring(0, 80) + ']';
      return JSON.stringify(part);
    }).join('\n');
  }
  return JSON.stringify(content, null, 2);
}

function msgContent(content) {
  return renderLongText(msgPlainText(content));
}

function renderToolCalls(toolCalls) {
  if (!toolCalls || !toolCalls.length) return '';
  return toolCalls.map(function(tc) {
    var func = tc.function || {};
    var argsHtml;
    try { argsHtml = renderJsonTree(JSON.parse(func.arguments || '{}')); } catch(e) { argsHtml = '<pre>' + esc(func.arguments || '') + '</pre>'; }
    return '<div class="tool-card"><div class="tool-name">' + esc(func.name || 'unknown') + '</div>' + argsHtml + '</div>';
  }).join('');
}

function renderTools(tools) {
  if (!tools || !tools.length) return '';
  return tools.map(function(tool) {
    var func = tool.function || tool;
    var html = '<div class="tool-card"><div class="tool-name">' + esc(func.name || 'unknown') + '</div>';
    if (func.description) html += '<div class="tool-desc">' + esc(func.description) + '</div>';
    if (func.parameters) html += renderJsonTree(func.parameters);
    html += '</div>';
    return html;
  }).join('');
}

function renderMessage(msg) {
  var role = msg.role || 'unknown';
  var roleLabel = esc(role);
  if (role === 'tool' && msg.tool_call_id) {
    roleLabel = 'tool <span style="color:#8b949e;font-weight:400">(' + esc(msg.tool_call_id) + ')</span>';
  }
  var html = '<div class="msg ' + esc(role) + '">';
  html += '<div class="msg-role">' + roleLabel + '</div>';
  html += '<div class="msg-content">' + msgContent(msg.content) + '</div>';
  if (msg.tool_calls && msg.tool_calls.length) {
    html += renderToolCalls(msg.tool_calls);
  }
  html += '</div>';
  return html;
}

function renderOverview(e) {
  var lines = 'Source: ' + sourceLabel(e) + '\nStatus: ' + e.status_code + '\nTime: ' + fmtTime(e.timestamp_ms) + '\nDuration: ' + fmtDuration(e.duration_ms) + '\nRequest: ' + fmtSize(e.request_body_size) + '  |  Response: ' + fmtSize(e.response_body_size);
  if (e.sse) {
    lines += '\nSSE: ' + (e.sse_combine_status || 'streaming');
    if (e.sse_duration_ms != null) lines += '  (' + e.sse_duration_ms + 'ms)';
  }
  return '<div class="detail-section"><h3>Overview</h3><pre>' + esc(lines) + '</pre></div>';
}

function renderAIMeta(e) {
  var ai = e.ai_insights || {};
  var aiReq = ai.request || {};
  var aiRes = ai.response || {};
  var req = (e.request_body && typeof e.request_body === 'object') ? e.request_body : {};
  var res = (e.response_body && typeof e.response_body === 'object') ? e.response_body : {};
  var html = '<div class="ai-meta">';
  html += metaItem('Model', aiReq.model || req.model || '-');
  if (aiRes.usage) {
    var u = aiRes.usage;
    html += metaItem('Tokens', (u.prompt_tokens||0) + ' prompt + ' + (u.completion_tokens||0) + ' completion = ' + (u.total_tokens||0) + ' total');
  }
  if (aiRes.finish_reasons && aiRes.finish_reasons.length) {
    html += metaItem('Finish', aiRes.finish_reasons.join(', '));
  }
  html += metaItem('Stream', req.stream ? 'Yes' : 'No');
  if (aiReq.message_count) html += metaItem('Messages', aiReq.message_count);
  html += '</div>';
  return html;
}

function renderChoices(choices) {
  var respHtml = '';
  choices.forEach(function(choice) {
    var msg = choice.message || {};
    if (msg.content) {
      respHtml += '<div class="msg assistant"><div class="msg-role">assistant</div><div class="msg-content">' + msgContent(msg.content) + '</div>';
      if (msg.tool_calls && msg.tool_calls.length) respHtml += renderToolCalls(msg.tool_calls);
      respHtml += '</div>';
    } else if (msg.tool_calls && msg.tool_calls.length) {
      respHtml += '<div class="msg assistant"><div class="msg-role">assistant (tool calls)</div>' + renderToolCalls(msg.tool_calls) + '</div>';
    }
  });
  return respHtml;
}

function registerAISections(e) {
  var aiReq = (e.ai_insights && e.ai_insights.request) || {};
  var req = (e.request_body && typeof e.request_body === 'object') ? e.request_body : {};
  var res = (e.response_body && typeof e.response_body === 'object') ? e.response_body : {};
  var sysPrompts = aiReq.system_prompts || [];
  if (sysPrompts.length) {
    sectionRenderers['system-prompt'] = function() {
      return '<pre>' + renderLongText(sysPrompts.join('\n---\n')) + '</pre>';
    };
  }
  var tools = req.tools || [];
  if (tools.length) {
    sectionRenderers['tools'] = function() { return renderTools(tools); };
  }
  var messages = (req.messages || []).filter(function(m) { return m.role !== 'system'; });
  if (messages.length) {
    sectionRenderers['messages'] = function() { return messages.map(renderMessage).join(''); };
  }
  var choices = res.choices || [];
  if (choices.length) {
    sectionRenderers['assistant-response'] = function() { return renderChoices(choices); };
  }
  if (e.sse && e.sse_combine_status) {
    sectionRenderers['sse-info'] = function() {
      var sseInfo = 'Combine status: ' + e.sse_combine_status;
      if (e.sse_duration_ms != null) sseInfo += '\nDuration: ' + e.sse_duration_ms + 'ms';
      if (e.sse_error) sseInfo += '\nError: ' + e.sse_error;
      return '<pre>' + esc(sseInfo) + '</pre>';
    };
  }
  sectionRenderers['raw-request'] = function() { return renderJsonTree(e.request_body); };
  sectionRenderers['raw-response'] = function() { return renderJsonTree(e.response_body); };
  return { sysPrompts: sysPrompts, tools: tools, messages: messages, choices: choices };
}

function registerAGUISections(e) {
  var res = (e.response_body && typeof e.response_body === 'object') ? e.response_body : {};
  var run = res.run || {};
  var messages = res.messages || [];
  if (messages.length) {
    sectionRenderers['agui-messages'] = function() {
      return messages.map(function(msg) {
        var role = msg.role || 'assistant';
        return '<div class="msg ' + esc(role) + '"><div class="msg-role">' + esc(role) + '</div><div class="msg-content">' + esc(msg.content || '') + '</div></div>';
      }).join('');
    };
  }
  var toolCalls = res.tool_calls || [];
  if (toolCalls.length) {
    sectionRenderers['agui-tool-calls'] = function() {
      return toolCalls.map(function(tc) {
        var h = '<div class="tool-card"><div class="tool-name">' + esc(tc.name || 'unknown') + '</div>';
        if (tc.arguments != null) h += '<h4>Arguments</h4>' + renderJsonTree(tc.arguments);
        if (tc.result != null) h += '<h4>Result</h4>' + renderJsonTree(tc.result);
        h += '</div>';
        return h;
      }).join('');
    };
  }
  var reasoning = res.reasoning || [];
  if (reasoning.length) {
    sectionRenderers['agui-reasoning'] = function() {
      return reasoning.map(function(r) { return '<pre>' + esc(r.content || '') + '</pre>'; }).join('');
    };
  }
  if (res.state != null) {
    sectionRenderers['agui-state'] = function() { return renderJsonTree(res.state); };
  }
  sectionRenderers['raw-request'] = function() { return renderJsonTree(e.request_body); };
  return { run: run, messages: messages, toolCalls: toolCalls, reasoning: reasoning };
}

function renderAGUIDetail(e) {
  var res = (e.response_body && typeof e.response_body === 'object') ? e.response_body : {};
  var run = res.run || {};
  var html = '';

  html += '<div class="ai-meta">';
  html += metaItem('Protocol', 'AGUI');
  if (run.run_id) html += metaItem('Run ID', run.run_id);
  if (run.thread_id) html += metaItem('Thread ID', run.thread_id);
  html += metaItem('Status', run.status || '-');
  html += metaItem('Events', res.event_count || 0);
  html += '</div>';

  if (run.error) {
    html += '<div class="detail-section"><pre style="color:#f85149">' + esc(run.error) + '</pre></div>';
  }

  var messages = res.messages || [];
  if (messages.length) {
    var msgsHtml = messages.map(function(msg) {
      var role = msg.role || 'assistant';
      return '<div class="msg ' + esc(role) + '"><div class="msg-role">' + esc(role) + '</div><div class="msg-content">' + esc(msg.content || '') + '</div></div>';
    }).join('');
    html += collapsible('&#x1F4AC; Messages (' + messages.length + ')', msgsHtml, false);
  }

  var toolCalls = res.tool_calls || [];
  if (toolCalls.length) {
    var tcHtml = toolCalls.map(function(tc) {
      var h = '<div class="tool-card"><div class="tool-name">' + esc(tc.name || 'unknown') + '</div>';
      if (tc.arguments != null) h += '<h4>Arguments</h4>' + renderJsonTree(tc.arguments);
      if (tc.result != null) h += '<h4>Result</h4>' + renderJsonTree(tc.result);
      h += '</div>';
      return h;
    }).join('');
    html += collapsible('&#x1F527; Tool Calls (' + toolCalls.length + ')', tcHtml, false);
  }

  var reasoning = res.reasoning || [];
  if (reasoning.length) {
    var rHtml = reasoning.map(function(r) { return '<pre>' + esc(r.content || '') + '</pre>'; }).join('');
    html += collapsible('&#x1F9E0; Reasoning', rHtml, false);
  }

  if (res.state != null) {
    html += collapsible('&#x1F4E6; State', renderJsonTree(res.state), false);
  }

  return html;
}

function renderGenericDetail(e) {
  var html = '';
  html += collapsible('&#x2B06;&#xFE0F; Request Body', renderJsonTree(e.request_body), false);
  html += collapsible('&#x2B07;&#xFE0F; Response Body', renderJsonTree(e.response_body), false);
  return html;
}

function renderDetail(e) {
  sectionRenderers = {};
  var html = '<h2>' + esc(e.method) + ' ' + esc(e.path) + '</h2>';
  html += renderOverview(e);

  if (e.ai_insights) {
    html += renderAIMeta(e);
    var parts = registerAISections(e);
    if (parts.sysPrompts.length) html += collapsible('&#x1F4DC; System Prompt', 'system-prompt');
    if (parts.tools.length) html += collapsible('&#x1F527; Tools (' + parts.tools.length + ')', 'tools');
    if (parts.messages.length) html += collapsible('&#x1F4AC; Messages (' + parts.messages.length + ')', 'messages');
    if (parts.choices.length) html += collapsible('&#x1F916; Assistant Response', 'assistant-response');
    if (e.sse && e.sse_combine_status) html += collapsible('&#x1F4E1; SSE Info', 'sse-info');
    html += collapsible('Raw Request', 'raw-request');
    html += collapsible('Raw Response', 'raw-response');
  } else if (e.response_body && typeof e.response_body === 'object' && e.response_body.object === 'agui.completion') {
    var res = e.response_body;
    var run = res.run || {};
    html += '<div class="ai-meta">';
    html += metaItem('Protocol', 'AGUI');
    if (run.run_id) html += metaItem('Run ID', run.run_id);
    if (run.thread_id) html += metaItem('Thread ID', run.thread_id);
    html += metaItem('Status', run.status || '-');
    html += metaItem('Events', res.event_count || 0);
    html += '</div>';
    if (run.error) {
      html += '<div class="detail-section"><pre style="color:#f85149">' + esc(run.error) + '</pre></div>';
    }
    var aguiParts = registerAGUISections(e);
    if (aguiParts.messages.length) html += collapsible('&#x1F4AC; Messages (' + aguiParts.messages.length + ')', 'agui-messages');
    if (aguiParts.toolCalls.length) html += collapsible('&#x1F557;&#xFE0F; Tool Calls (' + aguiParts.toolCalls.length + ')', 'agui-tool-calls');
    if (aguiParts.reasoning.length) html += collapsible('&#x1F9E0; Reasoning', 'agui-reasoning');
    if (res.state != null) html += collapsible('&#x1F4E6; State', 'agui-state');
    html += collapsible('Raw Request', 'raw-request');
  } else {
    sectionRenderers['raw-request'] = function() { return renderJsonTree(e.request_body); };
    sectionRenderers['raw-response'] = function() { return renderJsonTree(e.response_body); };
    html += collapsible('&#x2B06;&#xFE0F; Request Body', 'raw-request');
    html += collapsible('&#x2B07;&#xFE0F; Response Body', 'raw-response');
  }

  sectionRenderers['req-headers'] = function() { return renderHeaders(e.request_headers); };
  html += collapsible('Request Headers', 'req-headers');
  sectionRenderers['res-headers'] = function() { return renderHeaders(e.response_headers); };
  html += collapsible('Response Headers', 'res-headers');

  return html;
}

function renderStats(stats) {
  var bar = document.getElementById('stats-bar');
  bar.innerHTML = '<div class="stat"><div class="value">' + stats.total_requests + '</div><div class="label">Requests</div></div>'
    + '<div class="stat"><div class="value">' + stats.ai_requests + '</div><div class="label">AI Requests</div></div>'
    + '<div class="stat"><div class="value">' + stats.total_tokens.toLocaleString() + '</div><div class="label">Tokens</div></div>'
    + '<div class="stat"><div class="value">' + (stats.models.join(', ') || '-') + '</div><div class="label">Models</div></div>';
}

function renderTable() {
  var tbody = document.getElementById('traffic-table');
  if (!entries.length) {
    var msg = allEntries.length ? 'No traffic matches the current filters' : 'No traffic recorded yet';
    tbody.innerHTML = '<tr><td colspan="10" class="empty">' + msg + '</td></tr>';
    return;
  }
  tbody.innerHTML = entries.map(function(e, i) {
    var tags = [];
    if (e.ai || e.ai_insights) tags.push('<span class="badge ai">AI</span>');
    if (e.agui) tags.push('<span class="badge agui">AGUI</span>');
    if (e.tools) tags.push('<span class="badge tools">Tools</span>');
    if (e.sse) tags.push('<span class="badge sse">SSE</span>');
    return '<tr class="clickable' + (e._index === selectedIdx ? ' selected' : '') + '" onclick="showDetail(' + i + ')">'
      + '<td>' + i + '</td><td>' + fmtTime(e.timestamp_ms) + '</td>'
      + '<td><span class="badge source">' + esc(sourceLabel(e)) + '</span></td>'
      + '<td><span class="method ' + e.method + '">' + e.method + '</span></td>'
      + '<td>' + esc(e.path) + '</td>'
      + '<td><span class="status ' + statusClass(e.status_code) + '">' + e.status_code + '</span></td>'
      + '<td>' + fmtDuration(e.duration_ms) + '</td>'
      + '<td>' + fmtSize(e.request_body_size) + '</td><td>' + fmtSize(e.response_body_size) + '</td>'
      + '<td>' + tags.join(' ') + '</td></tr>';
  }).join('');
}

function matchesFilters(e) {
  if (filters.method && e.method !== filters.method) return false;
  if (filters.source && sourceLabel(e) !== filters.source) return false;
  if (filters.path && (e.path || '').toLowerCase().indexOf(filters.path.toLowerCase()) === -1) return false;
  if (filters.status) {
    var code = e.status_code || 0;
    if (filters.status === '2xx' && (code < 200 || code >= 300)) return false;
    if (filters.status === '4xx' && (code < 400 || code >= 500)) return false;
    if (filters.status === '5xx' && code < 500) return false;
  }
  if (filters.tags.length) {
    var hasTag = false;
    for (var t = 0; t < filters.tags.length; t++) {
      var tag = filters.tags[t];
      if (tag === 'ai' && (e.ai || e.ai_insights)) hasTag = true;
      else if (tag === 'agui' && e.agui) hasTag = true;
      else if (tag === 'sse' && e.sse) hasTag = true;
      else if (tag === 'tools' && e.tools) hasTag = true;
    }
    if (!hasTag) return false;
  }
  return true;
}

function applyFilters() {
  entries = allEntries.filter(matchesFilters);
  renderTable();
  updateClearButton();
}

function onFilterChange() {
  filters.method = document.getElementById('filter-method').value || null;
  filters.path = document.getElementById('filter-path').value;
  filters.status = document.getElementById('filter-status').value || null;
  filters.source = document.getElementById('filter-source').value || null;
  applyFilters();
}

function toggleTag(el) {
  var tag = el.getAttribute('data-tag');
  var idx = filters.tags.indexOf(tag);
  if (idx === -1) {
    filters.tags.push(tag);
    el.className = 'filter-chip active-' + tag;
  } else {
    filters.tags.splice(idx, 1);
    el.className = 'filter-chip';
  }
  applyFilters();
}

function updateClearButton() {
  var active = filters.method || filters.path || filters.status || filters.source || filters.tags.length;
  document.getElementById('filter-clear').style.display = active ? 'inline' : 'none';
}

function clearFilters() {
  filters = { method: null, path: '', status: null, source: null, tags: [] };
  document.getElementById('filter-method').value = '';
  document.getElementById('filter-path').value = '';
  document.getElementById('filter-status').value = '';
  document.getElementById('filter-source').value = '';
  var chips = document.querySelectorAll('.filter-chip');
  for (var c = 0; c < chips.length; c++) chips[c].className = 'filter-chip';
  applyFilters();
}

function showDetail(idx) {
  var summary = entries[idx];
  if (!summary) return;
  selectedIdx = summary._index;
  var rows = document.querySelectorAll('#traffic-table tr.clickable');
  for (var r = 0; r < rows.length; r++) {
    rows[r].classList.toggle('selected', r === idx);
  }
  var panel = document.getElementById('detail-panel');
  var overlay = document.getElementById('overlay');
  var content = document.getElementById('detail-content');
  content.innerHTML = '<div class="loading">Loading detail...</div>';
  panel.className = 'detail-panel open';
  overlay.className = 'overlay open';
  stopPolling();
  fetch('/api/traffic/' + summary._index)
    .then(function(res) { return res.json(); })
    .then(function(e) {
      if (e.error) { content.innerHTML = '<div class="loading">Error: ' + esc(e.error) + '</div>'; return; }
      currentDetail = e;
      detailTexts = [];
      detailValues = [];
      content.innerHTML = renderDetail(e);
    })
    .catch(function() {
      content.innerHTML = '<div class="loading">Failed to load detail</div>';
    });
}

function truncate() {
  if (!confirm('Clear all traffic log entries?')) return;
  fetch('/api/truncate', {method: 'POST'})
    .then(function() { closeDetail(); refresh(); })
    .catch(function(e) { console.error('Truncate failed:', e); });
}

function closeDetail() {
  document.getElementById('detail-panel').className = 'detail-panel';
  document.getElementById('overlay').className = 'overlay';
  currentDetail = null;
  startPolling();
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
});

(function() {
  var panel = document.getElementById('detail-panel');
  if (!panel || !panel.addEventListener) return;
  panel.addEventListener('toggle', function(ev) {
    var d = ev.target;
    if (!d || d.tagName !== 'DETAILS' || d.getAttribute('data-rendered') === 'true') return;
    var fn = sectionRenderers[d.getAttribute('data-section')];
    if (!fn || !currentDetail) return;
    var body = d.querySelector('.detail-body');
    if (body) body.innerHTML = fn(currentDetail);
    d.setAttribute('data-rendered', 'true');
  }, true);
})();

function populateSourceFilter() {
  var select = document.getElementById('filter-source');
  var seen = {};
  var labels = [];
  for (var i = 0; i < allEntries.length; i++) {
    var label = sourceLabel(allEntries[i]);
    if (!seen[label]) { seen[label] = true; labels.push(label); }
  }
  labels.sort();
  var current = filters.source || '';
  var html = '<option value="">All Sources</option>';
  for (var j = 0; j < labels.length; j++) {
    html += '<option' + (labels[j] === current ? ' selected' : '') + '>' + esc(labels[j]) + '</option>';
  }
  select.innerHTML = html;
  filters.source = select.value || null;
}

function refresh() {
  Promise.all([
    fetch('/api/traffic?limit=200'),
    fetch('/api/stats')
  ]).then(function(responses) {
    return Promise.all(responses.map(function(r) { return r.json(); }));
  }).then(function(results) {
    var traffic = results[0];
    var stats = results[1];
    allEntries = traffic.entries;
    allEntries.sort(function(a, b) { return (b.timestamp_ms || 0) - (a.timestamp_ms || 0); });
    populateSourceFilter();
    renderStats(stats);
    applyFilters();
    document.getElementById('last-refresh').textContent = 'Updated: ' + new Date().toLocaleTimeString();
  }).catch(function(e) {
    console.error('Refresh failed:', e);
  });
}

function startPolling() {
  if (refreshTimer == null) refreshTimer = setInterval(refresh, 3000);
}

function stopPolling() {
  if (refreshTimer != null) { clearInterval(refreshTimer); refreshTimer = null; }
}

refresh();
startPolling();
</script>
</body>
</html>
